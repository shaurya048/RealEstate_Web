<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Sarhadi - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#2E5A27",        // Rich forest green
                        "primary-hover": "#1F3F1B", // Darker forest green
                        secondary: "#7FA073",      // Sage green accent
                        "secondary-light": "#EAEFE9", // Soft cream sage background
                        accent: "#FAF9F6",         // Warm cream main background
                        "accent-dark": "#F2EFE9",    // Darker cream background
                        "text-main": "#1C2D1F",     // Charcoal green headings
                        "text-muted": "#566859",    // Muted slate text
                        "white-card": "#FFFFFF",    // Card background
                        "badge-green": "#D5E2D1",   // Badge background green
                    },
                    borderRadius: {
                        "4xl": "2rem",
                        "5xl": "2.5rem",
                    },
                    fontFamily: {
                        sans: ["'Plus Jakarta Sans'", "sans-serif"],
                        outfit: ["Outfit", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAF9F6;
            color: #1C2D1F;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        #auth-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: #FAF9F6; display: flex; align-items: center; justify-content: center;
        }
        .transition-all { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-accent min-h-screen">

<!-- Auth Overlay -->
<div id="auth-overlay">
    <div class="max-w-sm w-full p-8 border border-secondary-light/60 bg-white rounded-3xl shadow-lg text-center">
        <!-- Badge -->
        <div class="inline-flex items-center justify-center w-12 h-12 bg-badge-green text-primary rounded-full mb-6">
            <span class="material-symbols-outlined text-2xl">lock</span>
        </div>
        <h2 class="text-text-main font-outfit font-bold tracking-widest mb-6 text-center text-xl uppercase">Admin Access</h2>
        
        <input type="password" id="admin-pass" placeholder="Enter Password" class="w-full bg-accent border-0 focus:ring-2 focus:ring-primary text-text-main font-sans py-3.5 px-6 mb-6 rounded-full text-center shadow-inner" />
        
        <button onclick="checkAuth()" class="w-full py-3.5 bg-primary hover:bg-primary-hover text-white font-outfit text-xs font-bold uppercase tracking-widest rounded-full transition-all shadow-md">VERIFY</button>
        <p id="auth-error" class="text-red-500 text-[10px] tracking-widest font-bold uppercase text-center mt-4 hidden">Access Denied</p>
    </div>
</div>

<main id="admin-content" class="hidden p-6 md:p-16 max-w-7xl mx-auto">
    <div class="flex justify-between items-end mb-16 border-b border-secondary-light pb-8 gap-4">
        <div>
            <div class="inline-block bg-badge-green text-primary rounded-full px-4 py-1 mb-2">
                <span class="font-outfit uppercase tracking-widest text-[9px] font-extrabold">SECURE PORTAL</span>
            </div>
            <h1 class="text-3xl md:text-5xl text-text-main font-outfit font-bold uppercase tracking-tight leading-none">Private Inquiries</h1>
        </div>
        <a href="index.html" class="text-primary hover:text-primary-hover text-xs font-bold tracking-widest uppercase transition-all border-b border-primary pb-0.5 flex items-center gap-1">
            Return to Site
            <span class="material-symbols-outlined text-sm leading-none">arrow_forward</span>
        </a>
    </div>

    <!-- Table Container -->
    <div class="bg-white border border-secondary-light/60 rounded-3xl shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-secondary-light/40 border-b border-secondary-light text-text-muted text-[10px] font-extrabold uppercase tracking-widest">
                        <th class="py-4 px-6 font-bold">Date</th>
                        <th class="py-4 px-6 font-bold">Name</th>
                        <th class="py-4 px-6 font-bold">Contact Details</th>
                        <th class="py-4 px-6 font-bold">Message Details</th>
                    </tr>
                </thead>
                <tbody id="inquiries-table" class="text-text-main text-sm">
                    <tr><td colspan="4" class="text-center py-16 text-text-muted">Loading inquiries...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script>
    function checkAuth() {
        const pass = document.getElementById('admin-pass').value;
        // Simple client-side auth for the prototype (password: luxury)
        if (pass === 'luxury') {
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('admin-content').classList.remove('hidden');
            loadInquiries();
        } else {
            document.getElementById('auth-error').classList.remove('hidden');
        }
    }

    document.getElementById('admin-pass').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkAuth();
    });

    async function loadInquiries() {
        const tbody = document.getElementById('inquiries-table');
        try {
            const res = await fetch('http://localhost:3000/api/inquiries');
            const data = await res.json();
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-16 text-text-muted font-bold tracking-widest text-xs uppercase">No inquiries found.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(inquiry => {
                const date = new Date(inquiry.created_at).toLocaleDateString('en-US', {
                    month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });
                return `
                    <tr class="border-b border-secondary-light/40 hover:bg-secondary-light/10 transition-all">
                        <td class="py-6 px-6 whitespace-nowrap text-text-muted text-xs font-bold tracking-wider">${date}</td>
                        <td class="py-6 px-6 font-outfit font-bold text-text-main text-base">${inquiry.name}</td>
                        <td class="py-6 px-6">
                            <a href="mailto:${inquiry.email}" class="text-xs text-primary font-bold hover:underline">${inquiry.email}</a>
                            <div class="text-xs text-text-muted mt-0.5">${inquiry.phone || '-'}</div>
                        </td>
                        <td class="py-6 px-6 max-w-md text-text-muted leading-relaxed text-xs font-sans">${inquiry.details || '-'}</td>
                    </tr>
                `;
            }).join('');
        } catch(e) {
            console.error(e);
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-16 text-red-500 font-bold">Failed to load data. Please ensure the backend server is running.</td></tr>';
        }
    }
</script>

</body>
</html>
