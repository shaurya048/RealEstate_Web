<body class="font-body-md overflow-x-hidden">

<header class="bg-zinc-950 border-b border-white/10 sticky top-0 z-50">

<div class="hidden md:flex gap-12">
<a class="font-['Outfit'] uppercase tracking-[0.2em] text-xs font-medium text-white/60 hover:text-white transition-none" href="index.html">Home</a>
<a class="font-['Outfit'] uppercase tracking-[0.2em] text-xs font-medium text-[#D4AF37] border-b-2 border-[#D4AF37] pb-1 hover:text-white transition-none" href="listings.html">Listings</a>
<a class="font-['Outfit'] uppercase tracking-[0.2em] text-xs font-medium text-white/60 hover:text-white transition-none" href="property.html">Details</a>

</div>
<button class="font-['Outfit'] uppercase tracking-[0.2em] text-xs font-medium text-[#D4AF37] border border-[#D4AF37] px-6 py-2 hover:bg-[#D4AF37] hover:text-zinc-950 transition-none">Inquire</button>
</nav>
</header>
<main class="min-h-screen">
<!-- Hero/Filter Section -->
<section class="px-16 pt-32 pb-16 max-w-[1920px] mx-auto">
<h1 class="font-display-xl text-white mb-20">Exclusive Properties</h1>
<div class="grid grid-cols-1 md:grid-cols-5 gap-12 items-end border-b border-white/10 pb-12">
<div class="flex flex-col gap-4">
<label class="font-label-caps text-white/40 uppercase">Location</label>
<input class="bg-transparent border-0 border-b border-white/20 px-0 py-2 focus:ring-0 focus:border-[#D4AF37] text-body-lg text-white placeholder:text-white/20" placeholder="Global Destinations" type="text"/>
</div>
<div class="flex flex-col gap-4">
<label class="font-label-caps text-white/40 uppercase">Price Range</label>
<input class="bg-transparent border-0 border-b border-white/20 px-0 py-2 focus:ring-0 focus:border-[#D4AF37] text-body-lg text-white placeholder:text-white/20" placeholder="$5M - $50M+" type="text"/>
</div>
<div class="flex flex-col gap-4">
<label class="font-label-caps text-white/40 uppercase">Property Type</label>
<select class="bg-transparent border-0 border-b border-white/20 px-0 py-2 focus:ring-0 focus:border-[#D4AF37] text-body-lg text-white appearance-none">
<option class="bg-zinc-900">All Estates</option>
<option class="bg-zinc-900">Penthouses</option>
<option class="bg-zinc-900">Villas</option>
</select>
</div>
<div class="flex flex-col gap-4">
<label class="font-label-caps text-white/40 uppercase">Beds/Baths</label>
<input class="bg-transparent border-0 border-b border-white/20 px-0 py-2 focus:ring-0 focus:border-[#D4AF37] text-body-lg text-white placeholder:text-white/20" placeholder="4+ Beds" type="text"/>
</div>
<button class="bg-[#D4AF37] text-zinc-950 font-label-caps py-4 tracking-[0.3em] uppercase font-bold hover:brightness-110 transition-none">Search</button>
</div>
</section>
<!-- Listings Grid (Asymmetric) -->
<section class="px-16 py-16 max-w-[1920px] mx-auto grid grid-cols-12 gap-y-32 gap-x-12" id="listings-grid">
<!-- Rendered dynamically via JS -->
</section>
<script>
    async function loadListings() {
        const grid = document.getElementById('listings-grid');
        try {
            const res = await fetch('http://localhost:3000/api/listings');
            const listings = await res.json();
            
            grid.innerHTML = listings.map((l, idx) => {
                let colClass = "col-span-12 md:col-span-8 group cursor-pointer";
                if(idx % 2 !== 0) colClass = "col-span-12 md:col-span-4 mt-0 md:mt-32 group cursor-pointer";

                return `
<div class="${colClass}" onclick="window.location.href='property.html?id=${l.id}'">
<div class="relative overflow-hidden mb-8 h-[600px]">
<img class="w-full h-full object-cover grayscale brightness-75 group-hover:grayscale-0 group-hover:scale-105 transition-all duration-700" src="${l.images[0]}" />
</div>
<div class="flex flex-col md:flex-row justify-between items-start gap-8">
<div class="max-w-xl">
<h2 class="font-display-xl text-white mb-2">$${l.price.toLocaleString()}</h2>
<p class="font-body-md text-white/40 font-['Geist'] uppercase tracking-widest">${l.title}, ${l.location}</p>
</div>
<div class="flex gap-8 font-mono text-xs text-[#D4AF37] uppercase tracking-[0.2em] pt-4">
<span>${l.bedrooms} Beds</span>
<span class="text-white/10">/</span>
<span>${l.bathrooms} Baths</span>
</div>
</div>
</div>`;
            }).join('');
        } catch(e) {
            console.error("Failed to load listings:", e);
        }
    }
    loadListings();
</script>
<!-- Pagination -->
<section class="px-16 py-32 flex justify-center items-center gap-12 border-t border-white/5 max-w-[1920px] mx-auto">
<button class="font-label-caps text-white/20 uppercase hover:text-white transition-none">Previous</button>
<div class="flex gap-8">
<span class="font-label-caps text-[#D4AF37]">01</span>
<span class="font-label-caps text-white/20">02</span>
<span class="font-label-caps text-white/20">03</span>
<span class="font-label-caps text-white/20">...</span>
<span class="font-label-caps text-white/20">08</span>
</div>
<button class="font-label-caps text-white/60 uppercase hover:text-[#D4AF37] transition-none">Next</button>
</section>

</div>
