                        "primary-hover": "#1F3F1B", // Darker forest green

                        "secondary-light": "#EAEFE9", // Soft cream sage background
                        accent: "#FAF9F6",         // Warm cream main background
                        "accent-dark": "#F2EFE9",    // Darker cream background
                        "text-main": "#1C2D1F",     // Charcoal green headings
                        "text-muted": "#566859",    // Muted slate text
                        "white-card": "#FFFFFF",    // Card background
                        "badge-green": "#D5E2D1",   // Badge background green

                        "4xl": "2rem",
                        "5xl": "2.5rem",
                    },
                    fontFamily: {
                        sans: ["'Plus Jakarta Sans'", "sans-serif"],
                        outfit: ["Outfit", "sans-serif"],
                        mono: ["'JetBrains Mono'", "monospace"],
                    }
                }
            }
        }

            <a class="font-outfit uppercase tracking-widest text-[10px] font-bold text-primary border-b-2 border-primary pb-0.5" href="listings.html">Listings</a>

<main class="min-h-screen pt-28">
    <!-- Hero/Filter Section -->
    <section class="px-6 md:px-16 pt-16 pb-8 max-w-[1400px] mx-auto">
        <div class="mb-12">
            <div class="inline-block bg-badge-green text-primary rounded-full px-4 py-1.5 mb-4">
                <span class="font-outfit uppercase tracking-widest text-[9px] font-extrabold">Exquisite Collection</span>
            </div>
            <h1 class="font-outfit text-4xl md:text-6xl font-bold text-text-main tracking-tight leading-none">Exclusive Properties</h1>
        </div>

        <!-- Filter Board Dashboard -->
        <div class="bg-secondary-light/95 border border-white p-6 md:p-8 rounded-3xl shadow-sm">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-6 items-end">
                <div class="flex flex-col gap-2">
                    <label class="font-outfit text-[9px] font-extrabold uppercase tracking-widest text-text-muted ml-2">Location</label>
                    <input id="filter-location" class="bg-white border-0 focus:ring-2 focus:ring-primary text-sm font-bold text-text-main px-6 py-3.5 rounded-full placeholder:text-text-muted/40 shadow-sm" placeholder="Global Destinations" type="text"/>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="font-outfit text-[9px] font-extrabold uppercase tracking-widest text-text-muted ml-2">Min Price</label>
                    <input id="filter-min-price" class="bg-white border-0 focus:ring-2 focus:ring-primary text-sm font-bold text-text-main px-6 py-3.5 rounded-full placeholder:text-text-muted/40 shadow-sm" placeholder="e.g. 5000000" type="text"/>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="font-outfit text-[9px] font-extrabold uppercase tracking-widest text-text-muted ml-2">Max Price</label>
                    <input id="filter-max-price" class="bg-white border-0 focus:ring-2 focus:ring-primary text-sm font-bold text-text-main px-6 py-3.5 rounded-full placeholder:text-text-muted/40 shadow-sm" placeholder="e.g. 30000000" type="text"/>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="font-outfit text-[9px] font-extrabold uppercase tracking-widest text-text-muted ml-2">Property Type</label>
                    <select id="filter-type" class="bg-white border-0 focus:ring-2 focus:ring-primary text-sm font-bold text-text-main px-6 py-3.5 rounded-full shadow-sm appearance-none cursor-pointer">
                        <option value="">All Estates</option>
                        <option value="Penthouse">Penthouses</option>
                        <option value="Villa">Villas</option>
                        <option value="Estate">Estates</option>
                    </select>
                </div>
                <button onclick="applyFilters()" class="bg-primary hover:bg-primary-hover text-white font-outfit text-xs font-bold py-4 tracking-widest uppercase rounded-full shadow-md hover:shadow transition-all flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-sm">search</span>
                    Search
                </button>
            </div>
        </div>
    </section>

    <!-- Listings Grid (Asymmetric) -->
    <section class="px-6 md:px-16 py-12 max-w-[1400px] mx-auto grid grid-cols-12 gap-y-24 gap-x-8" id="listings-grid">
        <!-- Rendered dynamically via JS -->
    </section>

    <!-- Pagination -->
    <section class="px-6 py-16 flex justify-center items-center gap-12 border-t border-secondary-light/60 max-w-[1400px] mx-auto">
        <button class="font-outfit text-xs text-text-muted hover:text-primary uppercase font-bold tracking-widest transition-all">Previous</button>
        <div class="flex gap-4">
            <span class="font-outfit text-xs font-bold text-primary bg-badge-green px-3 py-1.5 rounded-full">01</span>
            <span class="font-outfit text-xs font-bold text-text-muted hover:text-primary px-3 py-1.5 rounded-full cursor-pointer transition-all">02</span>
            <span class="font-outfit text-xs font-bold text-text-muted hover:text-primary px-3 py-1.5 rounded-full cursor-pointer transition-all">03</span>
            <span class="font-outfit text-xs text-text-muted px-3 py-1.5">...</span>
            <span class="font-outfit text-xs font-bold text-text-muted hover:text-primary px-3 py-1.5 rounded-full cursor-pointer transition-all">08</span>
        </div>
        <button class="font-outfit text-xs text-text-muted hover:text-primary uppercase font-bold tracking-widest transition-all">Next</button>
    </section>
</main>

<script>
    async function loadListings(params = {}) {
        const grid = document.getElementById('listings-grid');
        grid.innerHTML = '<div class="col-span-12 text-center py-16 text-text-muted font-bold">Fetching matching properties...</div>';
        
        try {
            let url = new URL('http://localhost:3000/api/listings');
            Object.keys(params).forEach(key => {
                if (params[key]) url.searchParams.append(key, params[key]);
            });
            
            const res = await fetch(url);
            const listings = await res.json();
            
            if (listings.length === 0) {
                grid.innerHTML = '<div class="col-span-12 text-center py-16 text-text-muted font-bold">No exclusive properties found matching your criteria.</div>';
                return;
            }
            
            grid.innerHTML = listings.map((l, idx) => {
                let colClass = "col-span-12 md:col-span-8 group cursor-pointer bg-white rounded-3xl p-5 border border-secondary-light/35 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between";
                if(idx % 2 !== 0) colClass = "col-span-12 md:col-span-4 mt-0 md:mt-20 group cursor-pointer bg-white rounded-3xl p-5 border border-secondary-light/35 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between";

                return `
<div class="${colClass}" onclick="window.location.href='property.html?id=${l.id}'">
    <div>
        <div class="relative overflow-hidden mb-6 rounded-2xl h-[400px]">
            <img class="w-full h-full object-cover grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-700" src="${l.images[0]}" />
        </div>
        <div class="px-2">
            <span class="block text-[9px] font-extrabold text-secondary uppercase tracking-widest mb-1">${l.location}</span>
            <h2 class="font-outfit text-2xl font-bold text-text-main mb-2 leading-tight">${l.title}</h2>
            <span class="font-mono text-primary font-bold text-xl mb-4 block">$${l.price.toLocaleString()}</span>
        </div>
    </div>
    
    <div class="px-2 pt-4 border-t border-secondary-light flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex gap-4 font-outfit text-[10px] text-text-muted uppercase tracking-wider">
            <span class="flex items-center gap-1"><span class="material-symbols-outlined text-xs text-secondary">bed</span>${l.bedrooms} Beds</span>
            <span class="text-secondary-light">|</span>
            <span class="flex items-center gap-1"><span class="material-symbols-outlined text-xs text-secondary">bathtub</span>${l.bathrooms} Baths</span>
        </div>
        <span class="bg-primary hover:bg-primary-hover text-white rounded-full py-2 px-6 text-[10px] uppercase tracking-widest font-bold transition-all shadow-sm flex items-center gap-1">
            View Details
            <span class="material-symbols-outlined text-xs">arrow_forward</span>
        </span>
    </div>
</div>`;
            }).join('');
        } catch(e) {
            console.error("Failed to load listings:", e);
            grid.innerHTML = '<div class="col-span-12 text-center py-16 text-red-500 font-bold">Failed to load listings. Please make sure the backend server is running.</div>';
        }
    }
    
    function applyFilters() {
        const location = document.getElementById('filter-location').value;
        const minPrice = document.getElementById('filter-min-price').value;
        const maxPrice = document.getElementById('filter-max-price').value;
        
        const params = {};
        if (location) params.location = location;
        if (minPrice) params.minPrice = minPrice;
        if (maxPrice) params.maxPrice = maxPrice;
        
        loadListings(params);
    }

    loadListings();
</script>
