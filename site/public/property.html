<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Sarhadi Real Estate | Exclusive Listing Details</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#2E5A27",        // Rich forest green
                        "primary-hover": "#1F3F1B", // Darker forest green
                        secondary: "#7FA073",      // Sage green accent
                        "secondary-light": "#EAEFE9", // Soft cream sage background
                        accent: "#FAF9F6",         // Warm cream main background
                        "accent-dark": "#F2EFE9",    // Darker cream background
                        "text-main": "#1C2D1F",     // Charcoal green headings
                        "text-muted": "#566859",    // Muted slate text
                        "white-card": "#FFFFFF",    // Card background
                        "badge-green": "#D5E2D1",   // Badge background green
                    },
                    borderRadius: {
                        "4xl": "2rem",
                        "5xl": "2.5rem",
                    },
                    fontFamily: {
                        sans: ["'Plus Jakarta Sans'", "sans-serif"],
                        outfit: ["Outfit", "sans-serif"],
                        mono: ["'JetBrains Mono'", "monospace"],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAF9F6;
            color: #1C2D1F;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .transition-all { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-accent text-text-main selection:bg-secondary/30 selection:text-primary overflow-x-hidden">

<!-- Floating Pill Navigation Bar -->
<div class="fixed top-4 left-4 right-4 z-50 max-w-[1400px] mx-auto">
    <nav class="bg-white/90 backdrop-blur-md rounded-full shadow-lg border border-secondary-light px-8 py-3.5 flex justify-between items-center">
        <!-- Logo -->
        <a href="index.html" class="flex items-center gap-2 group">
            <span class="text-xl font-bold tracking-tight text-primary font-outfit">Sarhadi</span>
            <span class="text-[10px] uppercase tracking-widest text-secondary font-semibold border-l border-secondary-light pl-2">Real Estate</span>
        </a>
        
        <!-- Links -->
        <div class="hidden md:flex items-center gap-8">
            <a class="font-outfit uppercase tracking-widest text-[10px] font-bold text-text-muted hover:text-primary transition-all pb-0.5" href="index.html">Home</a>
            <a class="font-outfit uppercase tracking-widest text-[10px] font-bold text-text-muted hover:text-primary transition-all pb-0.5" href="listings.html">Listings</a>
            <a class="font-outfit uppercase tracking-widest text-[10px] font-bold text-primary border-b-2 border-primary pb-0.5" href="property.html">Details</a>
            <a class="font-outfit uppercase tracking-widest text-[10px] font-bold text-text-muted hover:text-primary transition-all pb-0.5" href="about.html">About</a>
            <a class="font-outfit uppercase tracking-widest text-[10px] font-bold text-text-muted hover:text-primary transition-all pb-0.5" href="testimonials.html">Testimonials</a>
            <a class="font-outfit uppercase tracking-widest text-[10px] font-bold text-text-muted hover:text-primary transition-all pb-0.5" href="contact.html">Contact</a>
        </div>
        
        <!-- Button -->
        <a href="contact.html" class="bg-primary hover:bg-primary-hover text-white font-outfit text-[10px] tracking-widest uppercase font-semibold px-6 py-2.5 rounded-full shadow-sm hover:shadow transition-all flex items-center gap-2">
            <span class="material-symbols-outlined text-xs leading-none">mail</span>
            Inquire
        </a>
    </nav>
</div>

<!-- Main Content Area -->
<main class="pt-24">
    <div id="property-container">
        <div class="px-6 py-32 text-center text-text-muted font-bold">Loading property details...</div>
    </div>
</main>

<script>
    async function loadProperty() {
        const urlParams = new URLSearchParams(window.location.search);
        let id = urlParams.get('id');
        const container = document.getElementById('property-container');
        
        try {
            if (!id) {
                const listRes = await fetch('http://localhost:3000/api/listings');
                const listData = await listRes.json();
                if (listData.length > 0) {
                    id = listData[0].id;
                } else {
                    throw new Error('No listings available');
                }
            }

            const res = await fetch(`http://localhost:3000/api/listings/${id}`);
            if (!res.ok) throw new Error('Listing not found');
            const p = await res.json();
            
            container.innerHTML = `
<!-- Hero Section: Organic full container spacing -->
<section class="relative px-4 md:px-8 pb-12 z-0">
    <div class="h-[75vh] md:h-[80vh] w-full bg-text-main rounded-[2.5rem] overflow-hidden shadow-lg border border-secondary-light">
        <img class="w-full h-full object-cover" src="${p.images[0] || ''}"/>
        <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent"></div>
    </div>
</section>

<!-- Asymmetric Detail Gallery with Organic Frames -->
<section class="px-6 md:px-16 -mt-24 relative z-10 grid grid-cols-12 gap-6 max-w-[1400px] mx-auto">
    <div class="col-span-12 md:col-span-5 aspect-[4/5] overflow-hidden rounded-[2rem] border-4 border-white shadow-md bg-accent-dark">
        <img class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700" src="${p.images[1] || p.images[0] || ''}"/>
    </div>
    
    <div class="col-span-12 md:col-span-7 flex flex-col justify-end">
        <div class="grid grid-cols-2 gap-6">
            <div class="aspect-square overflow-hidden rounded-[2rem] border-4 border-white shadow-md mt-16 md:mt-24 bg-accent-dark">
                <img class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700" src="${p.images[0] || ''}"/>
            </div>
            <div class="aspect-square overflow-hidden rounded-[2rem] border-4 border-white shadow-md bg-accent-dark">
                <img class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700" src="${p.images[1] || p.images[0] || ''}"/>
            </div>
        </div>
    </div>
</section>

<!-- Property Header -->
<section class="px-6 md:px-16 py-16 flex flex-col md:flex-row justify-between items-end gap-8 border-b border-secondary-light/60 max-w-[1400px] mx-auto">
    <div>
        <!-- Badge -->
        <div class="inline-flex items-center gap-2 bg-badge-green text-primary rounded-full px-4 py-1 mb-4">
            <span class="material-symbols-outlined text-xs leading-none">grade</span>
            <span class="font-outfit uppercase tracking-widest text-[9px] font-extrabold">Exclusive Listing</span>
        </div>
        
        <h1 class="font-outfit text-3xl md:text-5xl font-bold text-text-main uppercase max-w-4xl tracking-tight leading-none">${p.title},<br/><span class="text-secondary">${p.location.split(',')[0]}</span></h1>
        
        <div class="flex gap-8 mt-8 font-outfit text-xs text-text-muted uppercase tracking-wider">
            <div class="flex flex-col">
                <span class="text-[9px] font-extrabold text-text-muted/50 tracking-widest">BEDROOMS</span>
                <span class="text-text-main text-lg font-bold flex items-center gap-1"><span class="material-symbols-outlined text-sm text-secondary">bed</span>${p.bedrooms < 10 ? '0'+p.bedrooms : p.bedrooms}</span>
            </div>
            <div class="w-px h-10 bg-secondary-light/60"></div>
            <div class="flex flex-col">
                <span class="text-[9px] font-extrabold text-text-muted/50 tracking-widest">BATHROOMS</span>
                <span class="text-text-main text-lg font-bold flex items-center gap-1"><span class="material-symbols-outlined text-sm text-secondary">bathtub</span>${p.bathrooms < 10 ? '0'+p.bathrooms : p.bathrooms}</span>
            </div>
        </div>
    </div>
    
    <div class="text-right w-full md:w-auto">
        <span class="font-mono text-primary font-bold text-3xl md:text-5xl block mb-2">$${p.price.toLocaleString()}</span>
        <span class="font-outfit text-[10px] text-text-muted uppercase tracking-widest font-bold">Est. Mortgage: $${Math.floor(p.price * 0.005).toLocaleString()}/MO</span>
    </div>
</section>

<!-- Description & Details -->
<section class="px-6 md:px-16 py-16 grid grid-cols-1 md:grid-cols-3 gap-16 max-w-[1400px] mx-auto">
    <div class="md:col-span-2">
        <h2 class="font-outfit text-2xl font-bold text-text-main uppercase mb-6 tracking-wide">The Residence</h2>
        <div class="space-y-6 font-sans text-text-muted text-base leading-relaxed max-w-3xl">
            <p>${p.description}</p>
        </div>
    </div>
    
    <div>
        <h2 class="font-outfit text-xs font-extrabold text-text-main uppercase mb-6 tracking-widest">Key Features</h2>
        <ul class="space-y-0 border-t border-secondary-light/60">
            <li class="py-4 border-b border-secondary-light/60 flex justify-between items-center group cursor-pointer hover:bg-secondary-light/10 px-2 transition-all rounded-lg">
                <span class="font-outfit text-xs font-bold text-text-muted group-hover:text-primary uppercase tracking-widest">Heated Infinity Pool</span>
                <span class="material-symbols-outlined text-primary text-sm">arrow_forward</span>
            </li>
            <li class="py-4 border-b border-secondary-light/60 flex justify-between items-center group cursor-pointer hover:bg-secondary-light/10 px-2 transition-all rounded-lg">
                <span class="font-outfit text-xs font-bold text-text-muted group-hover:text-primary uppercase tracking-widest">1,200 Bottle Wine Cellar</span>
                <span class="material-symbols-outlined text-primary text-sm">arrow_forward</span>
            </li>
            <li class="py-4 border-b border-secondary-light/60 flex justify-between items-center group cursor-pointer hover:bg-secondary-light/10 px-2 transition-all rounded-lg">
                <span class="font-outfit text-xs font-bold text-text-muted group-hover:text-primary uppercase tracking-widest">Smart Home Integration</span>
                <span class="material-symbols-outlined text-primary text-sm">arrow_forward</span>
            </li>
        </ul>
    </div>
</section>

<!-- Agent Contact Block -->
<section class="mx-4 md:mx-8 mb-16 py-16 bg-secondary-light/50 border border-white rounded-[2.5rem] shadow-sm">
    <div class="max-w-5xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-12">
        <div class="flex flex-col sm:flex-row items-center gap-8 text-center sm:text-left">
            <div class="w-36 h-48 overflow-hidden rounded-[2rem] border-4 border-white shadow-md bg-accent-dark shrink-0">
                <img class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-500" src="agents.png"/>
            </div>
            <div>
                <h3 class="font-outfit text-2xl font-bold text-text-main mb-1">Ankit & Kunal Sarhadi</h3>
                <p class="font-outfit text-[9px] font-extrabold text-secondary tracking-widest uppercase mb-4">PRINCIPAL PARTNERS</p>
                <p class="font-sans text-text-muted text-xs leading-relaxed max-w-sm">Experience the architectural mastery of ${p.title}. Private tours are available by appointment for qualified purchasers.</p>
            </div>
        </div>
        
        <div class="text-center md:text-right shrink-0">
            <a href="contact.html" class="inline-block bg-primary hover:bg-primary-hover text-white px-8 py-3.5 rounded-full font-outfit text-xs font-bold uppercase tracking-widest shadow-md transition-all">
                Request a Private Tour
            </a>
        </div>
    </div>
</section>
            `;
        } catch(e) {
            console.error("Failed to load property:", e);
            container.innerHTML = '<div class="px-6 py-32 text-center text-red-500 font-bold">Failed to load property details. Please make sure the server is running.</div>';
        }
    }
    loadProperty();
</script>

<!-- Footer -->
<footer class="bg-accent-dark border-t border-secondary-light/80 py-16 px-6 md:px-16">
    <div class="max-w-[1400px] mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
        <div class="flex flex-col gap-2 items-center md:items-start text-center md:text-left">
            <div class="text-xl font-bold text-primary font-outfit tracking-tight">Sarhadi Real Estate</div>
            <p class="font-outfit uppercase tracking-widest text-[9px] font-bold text-text-muted">
                © 2026 Sarhadi Real Estate. Architectural Excellence.
            </p>
        </div>
        
        <div class="flex flex-wrap justify-center gap-8">
            <a class="font-outfit uppercase tracking-widest text-[9px] font-bold text-text-muted hover:text-primary transition-all" href="#">Privacy</a>
            <a class="font-outfit uppercase tracking-widest text-[9px] font-bold text-text-muted hover:text-primary transition-all" href="#">Terms</a>
            <a class="font-outfit uppercase tracking-widest text-[9px] font-bold text-text-muted hover:text-primary transition-all" href="#">Legal</a>
            <a class="font-outfit uppercase tracking-widest text-[9px] font-bold text-text-muted hover:text-primary transition-all" href="#">Press</a>
        </div>
        
        <div class="flex gap-4">
            <a href="#" class="w-10 h-10 bg-white border border-secondary-light rounded-full flex items-center justify-center text-text-muted hover:text-primary hover:shadow-sm transition-all">
                <span class="material-symbols-outlined text-sm leading-none">public</span>
            </a>
            <a href="#" class="w-10 h-10 bg-white border border-secondary-light rounded-full flex items-center justify-center text-text-muted hover:text-primary hover:shadow-sm transition-all">
                <span class="material-symbols-outlined text-sm leading-none">share</span>
            </a>
            <a href="contact.html" class="w-10 h-10 bg-white border border-secondary-light rounded-full flex items-center justify-center text-text-muted hover:text-primary hover:shadow-sm transition-all">
                <span class="material-symbols-outlined text-sm leading-none">mail</span>
            </a>
        </div>
    </div>
</footer>

</body>
</html>
