        body { background-color: #0e0e11; color: #e4e1e5; -webkit-font-smoothing: antialiased; }

<body class="font-body-md overflow-x-hidden">
<!-- Top Navigation Bar -->
<nav class="bg-zinc-950 border-b border-white/10 flex justify-between items-center w-full px-16 py-10 max-w-[1920px] mx-auto fixed top-0 z-50">
<div class="text-xl font-semibold tracking-tighter text-[#D4AF37] uppercase font-h1">
            Sarhadi Real Estate
        </div>
<div class="hidden md:flex items-center space-x-8">
<a class="font-['Outfit'] uppercase tracking-[0.2em] text-xs font-medium text-white/60 hover:text-white transition-none" href="index.html">Home</a>
<a class="font-['Outfit'] uppercase tracking-[0.2em] text-xs font-medium text-white/60 hover:text-white transition-none" href="listings.html">Listings</a>
<a class="font-['Outfit'] uppercase tracking-[0.2em] text-xs font-medium text-[#D4AF37] border-b-2 border-[#D4AF37] pb-1 transition-none" href="property.html">Details</a>

</div>
<button class="bg-primary-container text-on-primary-container px-8 py-3 font-label-caps uppercase text-[10px] tracking-[0.2em] hover:bg-[#D4AF37] hover:text-zinc-950 transition-none">
            Inquire
        </button>
</nav>
<!-- Main Content Canvas -->
<main class="pt-[104px]">
<div id="property-container">
<div class="px-16 py-32 text-center text-white">Loading property details...</div>
</div>
<script>
    async function loadProperty() {
        const urlParams = new URLSearchParams(window.location.search);
        let id = urlParams.get('id');
        const container = document.getElementById('property-container');
        
        try {
            if (!id) {
                const listRes = await fetch('http://localhost:3000/api/listings');
                const listData = await listRes.json();
                if (listData.length > 0) {
                    id = listData[0].id;
                } else {
                    throw new Error('No listings available');
                }
            }

            const res = await fetch(`http://localhost:3000/api/listings/${id}`);
            if (!res.ok) throw new Error('Listing not found');
            const p = await res.json();
            
            container.innerHTML = `
<!-- Hero Section: Full Bleed -->
<section class="w-full h-[921px] relative overflow-hidden">
<img class="w-full h-full object-cover" src="${p.images[0] || ''}"/>
<div class="absolute inset-0 bg-gradient-to-t from-zinc-950/60 to-transparent"></div>
</section>
<!-- Asymmetric Detail Gallery -->
<section class="px-16 -mt-32 relative z-10 grid grid-cols-12 gap-6">
<div class="col-span-12 md:col-span-5 aspect-[4/5] overflow-hidden">
<img class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700" src="${p.images[1] || p.images[0] || ''}"/>
</div>
<div class="col-span-12 md:col-span-7 flex flex-col justify-end">
<div class="grid grid-cols-2 gap-6 h-full">
<div class="aspect-square overflow-hidden mt-24">
<img class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700" src="${p.images[0] || ''}"/>
</div>
<div class="aspect-square overflow-hidden">
<img class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700" src="${p.images[1] || p.images[0] || ''}"/>
</div>
</div>
</div>
</section>
<!-- Property Header -->
<section class="px-16 py-24 flex flex-col md:flex-row justify-between items-end border-b border-white/10">
<div>
<span class="font-label-caps text-primary tracking-[0.3em] mb-4 block">EXCLUSIVE LISTING</span>
<h1 class="font-display-2xl text-white uppercase max-w-4xl">${p.title},<br/>${p.location.split(',')[0]}</h1>
<div class="flex gap-12 mt-12 font-mono text-sm tracking-widest text-white/60">
<div class="flex flex-col gap-2"><span class="text-[10px] uppercase font-label-caps text-white/40">Beds</span><span class="text-white text-lg">${p.bedrooms < 10 ? '0'+p.bedrooms : p.bedrooms}</span></div>
<div class="flex flex-col gap-2"><span class="text-[10px] uppercase font-label-caps text-white/40">Baths</span><span class="text-white text-lg">${p.bathrooms < 10 ? '0'+p.bathrooms : p.bathrooms}</span></div>
</div>
</div>
<div class="text-right">
<span class="font-display-xl text-primary-container block mb-2">$${p.price.toLocaleString()}</span>
<span class="font-label-caps text-white/40 tracking-[0.1em]">ESTIMATED MORTGAGE $${Math.floor(p.price * 0.005).toLocaleString()}/MO</span>
</div>
</section>
<!-- Description & Details -->
<section class="px-16 py-32 grid grid-cols-1 md:grid-cols-3 gap-24">
<div class="md:col-span-2">
<h2 class="font-h1 text-white uppercase mb-12 tracking-[0.1em]">The Residence</h2>
<div class="space-y-8 font-body-lg text-white/70 max-w-3xl leading-relaxed">
<p>${p.description}</p>
</div>
</div>
<div>
<h2 class="font-label-caps text-white uppercase mb-8 tracking-[0.2em] text-sm">Key Features</h2>
<ul class="space-y-0 border-t border-white/10">
<li class="py-6 border-b border-white/10 flex justify-between items-center group"><span class="font-label-caps text-white/60 group-hover:text-white transition-colors uppercase">Heated Infinity Pool</span><span class="material-symbols-outlined text-primary-container text-sm">arrow_forward</span></li>
<li class="py-6 border-b border-white/10 flex justify-between items-center group"><span class="font-label-caps text-white/60 group-hover:text-white transition-colors uppercase">1,200 Bottle Wine Cellar</span><span class="material-symbols-outlined text-primary-container text-sm">arrow_forward</span></li>
<li class="py-6 border-b border-white/10 flex justify-between items-center group"><span class="font-label-caps text-white/60 group-hover:text-white transition-colors uppercase">Smart Home Integration</span><span class="material-symbols-outlined text-primary-container text-sm">arrow_forward</span></li>
</ul>
</div>
</section>
<!-- Agent Contact Block -->
<section class="px-16 py-32 bg-surface-container-low border-t border-white/10">
<div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-16">
<div class="flex gap-12">
<div class="text-center group cursor-pointer">
<div class="w-48 h-64 overflow-hidden mb-6 bg-zinc-900">
<img class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500" src="agents.png"/>
</div>
<h3 class="font-h2 text-white uppercase text-lg">Ankit & Kunal Sarhadi</h3>
<p class="font-label-caps text-white/40 text-[10px] mt-1 tracking-widest">PRINCIPAL PARTNERS</p>
</div>
</div>
<div class="text-center md:text-left flex flex-col items-center md:items-start max-w-md">
<h2 class="font-display-xl text-white mb-6">Inquire for Private Access</h2>
<p class="font-body-md text-white/60 mb-10">Experience the architectural mastery of ${p.title}. Private tours are available by appointment for qualified purchasers.</p>
<button class="gold-border text-primary-container px-12 py-4 font-label-caps uppercase text-xs tracking-[0.2em] hover:bg-primary-container hover:text-zinc-950 transition-none">Request a Private Tour</button>
</div>
</div>
</section>
            `;
        } catch(e) {
            console.error("Failed to load property:", e);
            container.innerHTML = '<div class="px-16 py-32 text-center text-red-500">Failed to load property details. Please try again later.</div>';
        }
    }
    loadProperty();
</script>
